[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths =
    .
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow
    regression: marks tests as regression
    asyncio: marks tests as asyncio
    issue958: marks tests as issue958
    unit: marks tests as unit
    property: marks tests as property
    contract: marks tests as contract
    performance: marks tests as performance
    security: marks tests as security
    chaos: marks tests as chaos
    e2e: marks tests as e2e
