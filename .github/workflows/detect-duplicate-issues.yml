name: Detect duplicate issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  detect-duplicates:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sentence-transformers requests

      - name: Detect semantic duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}

        run: |
          python - <<'PY'
          import os
          import requests
          from sentence_transformers import SentenceTransformer, util

          token = os.environ["GITHUB_TOKEN"]
          issue_number = int(os.environ["ISSUE_NUMBER"])
          repository = os.environ["REPOSITORY"]

          owner, repo = repository.split("/")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # Get the new issue
          issue_url = (
              f"https://api.github.com/repos/{owner}/{repo}"
              f"/issues/{issue_number}"
          )

          response = requests.get(
              issue_url,
              headers=headers
          )
          response.raise_for_status()

          new_issue = response.json()

          new_text = (
              f"{new_issue.get('title', '')}\n"
              f"{new_issue.get('body', '') or ''}"
          ).strip()

          print(f"Checking issue #{issue_number}")
          print(f"Title: {new_issue['title']}")

          # Get all existing issues
          issues = []
          page = 1

          while True:
              issues_url = (
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/issues"
              )

              params = {
                  "state": "all",
                  "per_page": 100,
                  "page": page,
              }

              response = requests.get(
                  issues_url,
                  headers=headers,
                  params=params,
              )
              response.raise_for_status()

              batch = response.json()

              if not batch:
                  break

              issues.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          print(f"Found {len(issues)} GitHub items.")

          # Remove current issue and pull requests
          existing_issues = []

          for issue in issues:
              if issue["number"] == issue_number:
                  continue

              if "pull_request" in issue:
                  continue

              existing_issues.append(issue)

          if not existing_issues:
              print("No existing issues to compare.")
              exit(0)

          # Load semantic model
          print("Loading semantic similarity model...")

          model = SentenceTransformer(
              "all-MiniLM-L6-v2"
          )

          # Prepare existing issue text
          old_texts = []

          for issue in existing_issues:
              text = (
                  f"{issue.get('title', '')}\n"
                  f"{issue.get('body', '') or ''}"
              ).strip()

              old_texts.append(text)

          # Generate embeddings
          print("Generating embeddings...")

          new_embedding = model.encode(
              new_text,
              convert_to_tensor=True,
              normalize_embeddings=True,
          )

          old_embeddings = model.encode(
              old_texts,
              convert_to_tensor=True,
              normalize_embeddings=True,
          )

          # Calculate similarity
          similarities = util.cos_sim(
              new_embedding,
              old_embeddings
          )[0]

          # Similarity threshold
          similarity_threshold = 0.75

          similar_issues = []

          for issue, similarity in zip(
              existing_issues,
              similarities
          ):
              score = float(similarity)

              if score >= similarity_threshold:
                  similar_issues.append({
                      "issue": issue,
                      "score": score,
                  })

          # Highest similarity first
          similar_issues.sort(
              key=lambda item: item["score"],
              reverse=True,
          )

          # Only show top 5
          similar_issues = similar_issues[:5]

          # No duplicate found
          if not similar_issues:
              print("No semantically similar issues found.")
              exit(0)

          # Add duplicate label
          label_url = (
              f"https://api.github.com/repos/{owner}/{repo}"
              f"/issues/{issue_number}/labels"
          )

          label_response = requests.post(
              label_url,
              headers=headers,
              json={
                  "labels": ["duplicate"]
              },
          )

          if label_response.ok:
              print("Duplicate label added.")
          else:
              print(
                  "Could not add duplicate label:",
                  label_response.text
              )

          # Build comment
          comment_lines = [
              "## ⚠️ Possible Duplicate Issue Detected",
              "",
              (
                  "This issue appears to be semantically "
                  "similar to one or more existing issues."
              ),
              "",
              "| Issue | Similarity |",
              "| --- | ---: |",
          ]

          for item in similar_issues:
              issue = item["issue"]
              score = item["score"] * 100

              comment_lines.append(
                  f"| #{issue['number']} - "
                  f"[{issue['title']}]"
                  f"({issue['html_url']}) | "
                  f"{score:.1f}% |"
              )

          comment_lines.extend([
              "",
              "Please review these existing issues before proceeding.",
              "",
              (
                  "_Similarity is calculated using semantic "
                  "embeddings instead of exact keyword matching._"
              ),
          ])

          comment_body = "\n".join(comment_lines)

          # Create GitHub comment
          comment_url = (
              f"https://api.github.com/repos/{owner}/{repo}"
              f"/issues/{issue_number}/comments"
          )

          response = requests.post(
              comment_url,
              headers=headers,
              json={
                  "body": comment_body
              },
          )

          response.raise_for_status()

          print(
              f"Found {len(similar_issues)} "
              "possible duplicate issue(s)."
          )

          print("Semantic duplicate detection completed.")
          PY