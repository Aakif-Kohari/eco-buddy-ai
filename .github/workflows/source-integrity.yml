name: Source Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately the only dependency. These checks read source as text and
      # import nothing from the application, so they still run — and still
      # report something useful — when the tree is too broken to import.
      - name: Install test dependency
        run: python -m pip install pytest

      # A cheap first signal that names the broken file directly, before the
      # test output.
      - name: Check every file parses
        run: |
          python - <<'EOF'
          import ast, pathlib, sys

          skip = {".git", "__pycache__", ".pytest_cache", ".venv", "venv", "src"}
          broken = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  broken.append(f"{path}:{exc.lineno}: {exc.msg}")

          for entry in broken:
              print(f"::error::{entry}")
          if broken:
              print(f"\n{len(broken)} file(s) do not parse.")
              sys.exit(1)
          print("All files parse.")
          EOF

      - name: Run source integrity tests
        run: python -m pytest test_source_integrity.py -v
