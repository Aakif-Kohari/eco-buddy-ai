name: Auto Assign Issue to Creator

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Auto assign issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const creator = issue.user.login;

            // Don't auto-assign issues opened by the maintainer
            if (creator === "neeru24") {
              console.log("Issue opened by maintainer. Skipping auto assignment.");
              return;
            }

            // Count open issues currently assigned to this user
            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open assignee:${creator}`
            });

            if (issues.total_count >= 5) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `⚠️ @${creator}, you already have **5 open assigned issues**.\n\nPlease complete one of your existing issues before taking a new one. To ensure fair participation, contributors can work on a maximum of **5 issues at a time**. 🚀`
              });
              return;
            }

            // Assign the issue to its creator
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issue.number,
              assignees: [creator]
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `🎉 This issue has been automatically assigned to @${creator}.\n\n⏳ Please submit a working PR within **2 days (48 hours)** to keep your assignment active. Happy contributing! 🚀`
            });
